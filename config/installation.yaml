# The venue's physical input AND output topology (docs/installation.md).
# Input source of truth: "Betania Lydsystem - Inputs" patch sheet (captured
# 2026-08-24). Output source of truth: "Betania Lydsystem - Outputs" patch
# sheet plus owner clarification (captured 2026-08-25). Venue labels are
# Norwegian: V = venstre (left), H = høyre (right); direct stagebox sockets
# are labelled "V 09".."V 16" and "H 01", "H 09".."H 16" on stage, matching
# the box input numbers.
#
# No coordinates, ever: connectivity and visual layout are separate concerns
# (CLAUDE.md invariant 6). Stagebox -> AES50 edges, and mixer-output ->
# stagebox-output edges for a box's presented block, are *derived* by the
# domain and must never be written here. The optional `group` on a device is
# a *name* ("Stage left", "Left", "Other"), not a position — it says which
# part of the installation a device belongs to, never where it is drawn
# (docs/installation.md §"`group`").
#
# Channel names/assignments from the patch sheet (Vokal V1 -> C5, ...) are
# live mixer configuration — they come from the console at runtime and are
# deliberately NOT recorded here. The desk's own local inputs are modelled
# below as the "console" device (IN 1-3 in use: Bøyle, Håndholdt 1/2); all 32
# are declared, though only three are patched.
#
# `version: 2` only signals "this file uses output features" — v1 and v2
# behave identically (docs/installation.md §schema); this file uses output
# content, hence 2.

version: 2

devices:
  # Confirmed: two 16-in boxes daisy-chained on AES50-A. stagebox-1 (left/V)
  # is patched to the console's AES50-A port (bus channels 1-16); stagebox-2
  # (right/H) cascades through stagebox-1 (bus channels 17-32). AES50-B is
  # unused.
  #
  # Chain-order caveat: AES50 slots are positional. Re-ordering the boxes or
  # adding a third one is an `offset` edit here and nothing else.
  #
  # Output block assignment — the hop OSC cannot see (docs/installation.md
  # §"Output topology", "The output-block assignment"): which block of 8
  # console Out slots a box presents on its XLR outs is a setting on the box
  # itself, invisible over OSC. Stagebox V presents OUT9-16, Stagebox H
  # presents OUT1-8. Getting a box's `outputBlock.start` wrong silently
  # mislabels every one of its outputs — nothing over OSC will catch it.
  stagebox-1:
    kind: stagebox
    label: "Stagebox V"
    inputs: 16
    aes50: { bus: A, offset: 0 }
    outputs: 8
    outputBlock: { start: 9 }
    group: "Stage left"

  stagebox-2:
    kind: stagebox
    label: "Stagebox H"
    inputs: 16
    aes50: { bus: A, offset: 16 }
    outputs: 8
    outputBlock: { start: 1 }
    group: "Stage right"

  # Front mic panels ("MK Front"). Left has 8 sockets, all usable.
  front-left:
    kind: passive-panel
    label: "MK Front V"
    inputs: 8
    group: "Stage left"

  # Right is an 8-position link box, numbered by *physical position*
  # (owner decision 2026-08-27, issue #12) — not by the plate's own printed
  # labels, which are shifted by one (printed "1" sits on physical position
  # 2; see docs/installation.md "Real panel wiring"). Position 1 is broken
  # and connected to nothing; positions 2-8 feed Stagebox H inputs 2-8
  # (A18-A24). Accepted consequence: a technician reading the plate's own
  # printed numbers is one off from this app's numbering.
  front-right:
    kind: passive-panel
    label: "MK Front H"
    inputs: 8
    group: "Stage right"
    sockets:
      1: { status: broken, note: "Defekt — ikke i bruk" }

  # The desk's own local XLR inputs (IN 1-32 at FOH). Three are in use per
  # the "Betania Lydsystem - Inputs" sheet: IN 1 Bøyle -> CH1, IN 2 Håndholdt
  # 1 -> CH2, IN 3 Håndholdt 2 -> CH3 (live mixer configuration, not
  # recorded here). All 32 are declared, truthfully, even though only three
  # are patched — an unused socket renders like any other unconsumed one.
  # Deliberately ungrouped: the desk is not part of the stage or the
  # destination groupings, and being ungrouped is an ordinary state.
  console:
    kind: console
    label: "Mikserpult (FOH)"
    inputs: 32

  # Powered speakers/zones (docs/installation.md §"Output topology"). The
  # cabinets are powered — no amplifier devices sit between a physical output
  # and one of these. A destination has no socket number of its own; `inputs`
  # is never authored here (the loader supplies 0 on the way to the domain).
  #
  # Declaration order is the reading order (issue #22): the UI draws groups in
  # order of first appearance and devices in the order listed here. Still not
  # a coordinate — it says which speaker is named first, not where on screen it
  # lands. Hence Other, then Left (front to back, then Sub and Main), then
  # Right: the order the previous hard-coded layout drew, now data.
  sidesal:
    kind: destination
    label: "Sidesal"
    group: "Other"

  vip-rom:
    kind: destination
    label: "Vip Rom"
    group: "Other"

  front-venstre:
    kind: destination
    label: "Front Venstre"
    group: "Left"

  piano-venstre:
    kind: destination
    label: "Piano Venstre"
    group: "Left"

  venstre-bak:
    kind: destination
    label: "Venstre Bak"
    group: "Left"

  sub:
    kind: destination
    label: "Sub"
    group: "Left"

  main-left:
    kind: destination
    label: "Main Left"
    group: "Left"

  front-hoyre:
    kind: destination
    label: "Front Høyre"
    group: "Right"

  piano-hoyre:
    kind: destination
    label: "Piano Høyre"
    group: "Right"

  bak-hoyre:
    kind: destination
    label: "Bak Høyre"
    group: "Right"

  main-right:
    kind: destination
    label: "Main Right"
    group: "Right"

# Panel socket -> stagebox input, in signal direction, per the patch sheet.
#
# Left:  MK Front V sockets 1-8 -> Stagebox V inputs 1-8 (A1-A8).
#        Stagebox V inputs 9-16 are direct stage sockets "V 09".."V 16".
# Right: Stagebox H input 1 is the direct socket "H 01" (A17).
#        MK Front H is position-faithful with a dead first socket: socket 1
#        is broken (annotated above, not cabled); sockets 2-8 -> Stagebox H
#        inputs 2-8 (A18-A24). The plate's printed labels are one lower than
#        this numbering (issue #12).
#        Stagebox H inputs 9-16 are direct stage sockets "H 09".."H 16".
connections:
  - from: { device: front-left, input: 1 }
    to: { device: stagebox-1, input: 1 }
  - from: { device: front-left, input: 2 }
    to: { device: stagebox-1, input: 2 }
  - from: { device: front-left, input: 3 }
    to: { device: stagebox-1, input: 3 }
  - from: { device: front-left, input: 4 }
    to: { device: stagebox-1, input: 4 }
  - from: { device: front-left, input: 5 }
    to: { device: stagebox-1, input: 5 }
  - from: { device: front-left, input: 6 }
    to: { device: stagebox-1, input: 6 }
  - from: { device: front-left, input: 7 }
    to: { device: stagebox-1, input: 7 }
  - from: { device: front-left, input: 8 }
    to: { device: stagebox-1, input: 8 }

  - from: { device: front-right, input: 2 }
    to: { device: stagebox-2, input: 2 }
  - from: { device: front-right, input: 3 }
    to: { device: stagebox-2, input: 3 }
  - from: { device: front-right, input: 4 }
    to: { device: stagebox-2, input: 4 }
  - from: { device: front-right, input: 5 }
    to: { device: stagebox-2, input: 5 }
  - from: { device: front-right, input: 6 }
    to: { device: stagebox-2, input: 6 }
  - from: { device: front-right, input: 7 }
    to: { device: stagebox-2, input: 7 }
  - from: { device: front-right, input: 8 }
    to: { device: stagebox-2, input: 8 }

  # Physical output -> destination cabling, per "Betania Lydsystem - Outputs"
  # (docs/installation.md §"Output topology"). Slot -> physical output is
  # NOT written here: for a stagebox it is derived from `outputBlock.start`
  # above, and for a console XLR it is the console's identity default (Out n
  # carries on console XLR n), also derived — never authored. Only the console
  # outs actually in use (1-2) are cabled; if `/config/routing/OUT/*` is ever
  # set non-default at this venue, that is an adapter concern (#10), not a
  # schema one.
  #
  # console XLR out 1 -> Sidesal, console XLR out 2 -> Vip Rom.
  - from: { consoleOutput: 1 }
    to: { device: sidesal }
  - from: { consoleOutput: 2 }
    to: { device: vip-rom }

  # Stagebox H (stagebox-2, OUT1-8) outs 6-8.
  - from: { device: stagebox-2, output: 6 }
    to: { device: bak-hoyre }
  - from: { device: stagebox-2, output: 7 }
    to: { device: piano-hoyre }
  - from: { device: stagebox-2, output: 8 }
    to: { device: front-hoyre }

  # Stagebox V (stagebox-1, OUT9-16) outs 3-8.
  - from: { device: stagebox-1, output: 3 }
    to: { device: venstre-bak }
  - from: { device: stagebox-1, output: 4 }
    to: { device: piano-venstre }
  - from: { device: stagebox-1, output: 5 }
    to: { device: front-venstre }
  - from: { device: stagebox-1, output: 6 }
    to: { device: sub }
  - from: { device: stagebox-1, output: 7 }
    to: { device: main-left }
  - from: { device: stagebox-1, output: 8 }
    to: { device: main-right }
